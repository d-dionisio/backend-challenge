services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "${LOCALSTACK_PORT:-14566}:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - ./scripts/init-sqs.py:/etc/localstack/init/ready.d/init-sqs.py:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events --region us-east-1 > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
